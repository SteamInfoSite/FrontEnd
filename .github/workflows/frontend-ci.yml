name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::810876577038:role/SteamInfoSiteFrontendDeployRole
          aws-region: ap-northeast-2

      - name: Upload frontend to S3
        run: |
          tar -czf frontend-dist.tar.gz -C dist .
          aws s3api put-object \
            --bucket steaminfosite-cd-artifacts-810876577038 \
            --key "frontend/${GITHUB_SHA}/dist.tar.gz" \
            --body frontend-dist.tar.gz \
            --query ETag \
            --output text

      - name: Deploy and check result
        run: |
          set -euo pipefail
          instance_id="i-03d2cf4a198422ab8"
          parameters="$(printf '{"commands":["/usr/local/sbin/steaminfosite-deploy-frontend %s"]}' "$GITHUB_SHA")"

          command_id="$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $command_id"
          status=""
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          test "$status" = Success