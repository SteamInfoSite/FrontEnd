<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movie Main</title>
    <!-- Swiper CSS (슬라이드 배너용) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f4f4; color: #333; }

        /* 1-1, 1-2, 1-3. 상단 헤더 영역 */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; background: #fff; border-bottom: 1px solid #ddd; }
        .logo { font-size: 24px; font-weight: bold; color: #e50914; }
        nav a { margin: 0 15px; text-decoration: none; color: #333; font-weight: 500; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .search-box input { padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-auth { padding: 6px 12px; background: #e50914; color: #fff; border: none; border-radius: 4px; cursor: pointer; }

        /* 메인 컨테이너 */
        container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: block; }

        /* 2-1. 이미지 순환형 메인 배너 (Swiper) */
        .swiper { width: 100%; height: 350px; border-radius: 8px; margin-bottom: 30px; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* 2-2. CTA 유도 배너 & 버튼 2개 */
        .cta-section { background: #fff; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .cta-buttons button { padding: 10px 20px; margin-left: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #e50914; color: #fff; }
        .btn-secondary { background: #555; color: #fff; }

        /* 2-3. 카드형 콘텐츠 노출 */
        .section-title { font-size: 20px; margin-bottom: 15px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .movie-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .movie-card img { width: 100%; height: 250px; object-fit: cover; }
        .movie-card h4 { padding: 12px 5px; font-size: 16px; }

        /* 2-4. 푸터 영역 */
        footer { background: #222; color: #888; text-align: center; padding: 20px; margin-top: 50px; font-size: 14px; }
    </style>
</head>
<body>

<!-- 상단 헤더 -->
<header>
    <div class="logo">MOVIE</div>
    <nav>
        <a href="#">홈</a>
        <a href="#">소개</a>
        <a href="#">현재 인기 영화</a>
        <a href="#" onclick="alert('준비 중입니다.')">주문내역</a>
        <a href="#" onclick="alert('준비 중입니다.')">예매 현황</a>
    </nav>
    <div class="header-right">
        <div class="search-box">
            <input type="text" placeholder="검색창">
        </div>
        <button class="btn-auth" onclick="alert('준비 중입니다.')">로그인/회원가입</button>
    </div>
</header>

<container>
    <!-- 2-1. 메인 순환 배너 (3초 지연 자동 순환) -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide" th:each="banner : ${mainBanners}">
                <img th:src="${banner.imageUrl}" th:alt="${banner.title}">
            </div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
    </div>

    <!-- 2-2. CTA 유도 배너 & 버튼 2개 -->
    <div class="cta-section" th:if="${not #lists.isEmpty(ctaBanner)}">
        <div>
            <h3 th:text="${ctaBanner[0].title}">CTA 유도 배너</h3>
            <p>메인 상품 광고 영역입니다.</p>
        </div>
        <div class="cta-buttons">
            <button class="btn-primary" onclick="alert('등록하기 클릭')">등록하기</button>
            <button class="btn-secondary" onclick="alert('둘러보기 클릭')">둘러보기</button>
        </div>
    </div>

    <!-- 2-3. 카드형 콘텐츠 (인기 영화) -->
    <h2 class="section-title">인기 영화 목록</h2>
    <div class="movie-grid">
        <div class="movie-card" th:each="movie : ${popularMovies}">
            <img th:src="${movie.posterUrl}" th:alt="${movie.title}">
            <h4 th:text="${movie.title}">영화 제목</h4>
        </div>
    </div>
</container>

<!-- 2-4. 푸터 영역 -->
<footer>
    <p>&copy; 2026 Movie Project. All rights reserved.</p>
</footer>

<!-- Swiper JS Script (3초 지연 순환 적용) -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    var swiper = new Swiper(".mySwiper", {
        loop: true,
        autoplay: {
            delay: 3000, // 3초 지연 (2-1-2 명세)
            disableOnInteraction: false,
        },
        pagination: {
            el: ".swiper-pagination",
            clickable: true,
        },
        navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
        },
    });
</script>
</body>
</html>
