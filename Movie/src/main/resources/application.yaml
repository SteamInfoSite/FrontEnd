server:
  port: 8080

spring:
  application:
    name: Movie

  # H2 데이터베이스 설정
  datasource:
    url: jdbc:h2:~/moviedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Web Console 설정 (http://localhost:8080/h2-console 접속용)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 설정 (Entity 클래스를 읽어서 DB 테이블 자동 생성)
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true